<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Delivery Method</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }
        .delivery-option {
            border: 2px solid #e5e5e5;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .delivery-option:hover {
            border-color: #198754;
            background: #f4fbf7;
        }
        .delivery-option input {
            margin-right: 12px;
        }
        .option-title {
            font-weight: 700;
            font-size: 17px;
        }
        .time-badge {
            display: inline-block;
            margin-top: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>

<body>
{% include 'navbar.html' %}

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h2 class="fw-bold mb-1">🚚 Delivery Method</h2>
        <p class="text-muted mb-4">
            Choose how you would like to receive your pet. The system will calculate an approximate delivery timeframe.
        </p>

        <form method="POST">
            <!-- HOME DELIVERY -->
            <label class="delivery-option d-block">
                <input type="radio"
                       name="transport_method"
                       value="Home Delivery"
                       {% if not adoption or not adoption[3] or adoption[3] == 'Home Delivery' %}checked{% endif %}>
                <span class="option-title">🚚 Home Delivery</span>
                <div class="text-muted small ms-4 mt-1">
                    The pet will be safely transported and delivered directly to your home address.
                </div>
                <div class="ms-4">
                    <span class="time-badge">⏱️ Estimated Time: Approximately 2–4 hours</span>
                </div>
            </label>

            <!-- SHELTER PICKUP -->
            <label class="delivery-option d-block">
                <input type="radio"
                       name="transport_method"
                       value="Shelter Pickup"
                       {% if adoption and adoption[3] == 'Shelter Pickup' %}checked{% endif %}>
                <span class="option-title">🏠 Shelter Pickup</span>
                <div class="text-muted small ms-4 mt-1">
                    Pick up the pet directly from the shelter location.
                </div>
                <div class="ms-4">
                    <span class="time-badge">⏱️ Estimated Time: Approximately 30–60 minutes</span>
                </div>
            </label>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mt-3">
                ✓ Confirm Delivery Method
            </button>

            <div class="text-center mt-3">
                <a href="{{ url_for('my_requests') }}" class="text-muted small text-decoration-none">
                    ← Back to My Requests
                </a>
            </div>
        </form>
    </div>
</div>

{% include 'footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
