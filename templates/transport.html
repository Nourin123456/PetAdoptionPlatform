<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Delivery Method | DreamlyPaws</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dreamly_theme.css') }}">
    <style>
        .delivery-card-option {
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            display: block;
        }
        .delivery-card-option:hover {
            border-color: #7c3aed;
            background: #faf5ff;
        }
        .delivery-card-option input:checked ~ .option-content {
            color: #1e1b4b;
        }
    </style>
</head>

<body>
{% include 'navbar.html' %}

<div class="container py-5" style="max-width: 620px;">

    <div class="dreamly-card p-4 p-md-5">

        <div class="text-center mb-4">
            <div class="pill-tag mb-2">
                <span>🚚 Safe Arrival</span>
            </div>
            <h2 class="dreamly-serif mb-1" style="font-size: 2.3rem;">
                Delivery <span class="dreamly-gradient-text">Preference</span>
            </h2>
            <p class="hand-note" style="color: #7c3aed; font-size: 1.25rem;">
                Choose how you'd like your new best friend to arrive home ♡
            </p>
        </div>

        <form method="POST">
            <!-- HOME DELIVERY -->
            <label class="delivery-card-option">
                <div class="d-flex align-items-start gap-3">
                    <input type="radio"
                           name="transport_method"
                           value="Home Delivery"
                           class="form-check-input mt-1"
                           {% if not adoption or not adoption[3] or adoption[3] == 'Home Delivery' %}checked{% endif %}>
                    <div class="option-content">
                        <div class="fw-bold fs-6" style="color: #1e1b4b;">🚚 Safe Home Delivery</div>
                        <div class="text-muted small mt-1">
                            Your pet is carefully transported and delivered directly to your doorstep, coordinated safely by the shelter.
                        </div>
                    </div>
                </div>
            </label>

            <!-- SHELTER PICKUP -->
            <label class="delivery-card-option">
                <div class="d-flex align-items-start gap-3">
                    <input type="radio"
                           name="transport_method"
                           value="Shelter Pickup"
                           class="form-check-input mt-1"
                           {% if adoption and adoption[3] == 'Shelter Pickup' %}checked{% endif %}>
                    <div class="option-content">
                        <div class="fw-bold fs-6" style="color: #1e1b4b;">🏠 Shelter Pickup</div>
                        <div class="text-muted small mt-1">
                            Pick up your companion directly from the sanctuary or shelter premises at an agreed appointment.
                        </div>
                    </div>
                </div>
            </label>

            <!-- PREFERRED DELIVERY DATE -->
            <div class="mb-4 mt-3">
                <label for="transport_date" class="form-label fw-bold" style="color: #1e1b4b;">
                    📅 Preferred Delivery Date
                </label>
                <input type="date"
                       class="form-control form-control-lg rounded-4"
                       id="transport_date"
                       name="transport_date"
                       min="{{ today }}"
                       value="{{ adoption[7] if adoption and adoption[7] else '' }}">
                <div class="form-text">Choose your preferred date for pet delivery or shelter handover.</div>
            </div>

            <button type="submit" class="btn btn-dark-pill btn-lg w-100 fw-bold py-3 mt-2">
                ✓ Confirm Delivery &amp; Transit Preferences
            </button>

            <div class="text-center mt-4">
                <a href="{{ url_for('my_requests') }}" class="text-muted small text-decoration-none">
                    ← Back to My Requests
                </a>
            </div>
        </form>

    </div>

</div>

{% include 'footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
