<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Schedule Transport</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .container-box {
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
        }

        .card-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .transport-option {
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .transport-option:hover {
            border-color: #198754;
            background: #f4fbf7;
        }

        .transport-option input {
            margin-right: 10px;
        }

        .option-title {
            font-weight: 600;
        }

        label.form-label {
            font-weight: 600;
            margin-top: 15px;
        }

        .btn-submit {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-submit:hover {
            background: #157347;
        }

    </style>

</head>

<body>

<div class="container-box">

    <div class="card-box">

        <h2>🚚 Schedule Transport</h2>

        <p class="subtitle">
            Choose how and when you would like to receive your pet.
        </p>


        <form method="POST">


            <!-- TRANSPORT METHOD -->

            <label class="transport-option">

                <input
                    type="radio"
                    name="transport_method"
                    value="Self Pickup"
                    required
                >

                <span class="option-title">
                    🏠 Self Pickup
                </span>

                <small class="d-block text-muted ms-4">
                    Pick up the pet directly from the shelter.
                </small>

            </label>


            <label class="transport-option">

                <input
                    type="radio"
                    name="transport_method"
                    value="Home Delivery"
                >

                <span class="option-title">
                    🚚 Home Delivery
                </span>

                <small class="d-block text-muted ms-4">
                    The pet will be transported to your address.
                </small>

            </label>


            <!-- DATE -->

            <label
                for="transport_date"
                class="form-label"
            >
                📅 Transport Date
            </label>

            <input
                type="date"
                id="transport_date"
                name="transport_date"
                class="form-control"
                required
            >


            <!-- TIME -->

            <label
                for="transport_time"
                class="form-label"
            >
                ⏰ Transport Time
            </label>

            <input
                type="time"
                id="transport_time"
                name="transport_time"
                class="form-control"
                required
            >


            <button
                type="submit"
                class="btn-submit"
            >
                📅 Schedule Transport
            </button>

        </form>

    </div>

</div>


<script>

    // Prevent selecting a past date

    const dateInput =
        document.getElementById("transport_date");

    const today =
        new Date().toISOString().split("T")[0];

    dateInput.min = today;

</script>

</body>

</html>
