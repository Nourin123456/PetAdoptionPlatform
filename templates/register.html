<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - Pet Adoption</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .role-card {
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-check:checked + .role-card {
            border-color: #198754;
            background-color: #f0fdf4;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15);
        }
    </style>
</head>

<body class="bg-light">
{% include 'navbar.html' %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow border-0 rounded-4 p-4 p-md-5">

                <h2 class="text-center mb-1 fw-bold">
                    🐾 Create Your Account
                </h2>
                <p class="text-center text-muted mb-4 small">
                    Join our pet adoption community today.
                </p>

                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                    ⚠️ {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form action="{{ url_for('register') }}" method="POST" novalidate>

                    <!-- REGISTER AS -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            Register As <span class="text-danger">*</span>
                        </label>
                        <div class="row g-3">
                            <div class="col-6">
                                <input type="radio"
                                       class="btn-check"
                                       name="role"
                                       id="roleAdopter"
                                       value="Adopter"
                                       {% if not form_data or form_data.get('role') == 'Adopter' %}checked{% endif %}
                                       required>
                                <label class="role-card d-block h-100" for="roleAdopter">
                                    <div class="fw-bold text-success fs-6">👤 Adopter</div>
                                    <div class="text-muted small mt-1">Looking to adopt a loving pet</div>
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio"
                                       class="btn-check"
                                       name="role"
                                       id="roleShelter"
                                       value="Shelter"
                                       {% if form_data and form_data.get('role') == 'Shelter' %}checked{% endif %}
                                       required>
                                <label class="role-card d-block h-100" for="roleShelter">
                                    <div class="fw-bold text-success fs-6">🏢 Shelter / Breeder</div>
                                    <div class="text-muted small mt-1">Shelter listing pets for adoption</div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- FULL NAME -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold" id="nameLabel">
                            Full Name <span class="text-danger">*</span>
                        </label>
                        <input
                            type="text"
                            name="fullname"
                            id="fullname"
                            class="form-control"
                            placeholder="Enter your full name"
                            value="{{ form_data.fullname if form_data else '' }}"
                            pattern="^[A-Za-z\s.'-]+$"
                            required
                            minlength="2">
                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Email Address <span class="text-danger">*</span>
                        </label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="example@gmail.com"
                            value="{{ form_data.email if form_data else '' }}"
                            required>
                    </div>

                    <!-- PHONE -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Phone Number <span class="text-danger">*</span>
                        </label>
                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            placeholder="10-digit mobile number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            minlength="10"
                            value="{{ form_data.phone if form_data else '' }}"
                            required>
                        <div class="form-text">Must be exactly 10 digits without spaces or special characters.</div>
                    </div>

                    <!-- ADDRESS -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Address <span class="text-danger">*</span>
                        </label>
                        <textarea
                            name="address"
                            class="form-control"
                            rows="2"
                            placeholder="Enter your address"
                            required>{{ form_data.address if form_data else '' }}</textarea>
                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Password <span class="text-danger">*</span>
                        </label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="At least 6 characters"
                            required
                            minlength="6">
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            Confirm Password <span class="text-danger">*</span>
                        </label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Re-enter password"
                            required
                            minlength="6">
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
                        Register Account
                    </button>

                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}" class="text-success fw-semibold text-decoration-none">
                        Login here
                    </a>
                </p>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Update name label when role changes
    const roleAdopter = document.getElementById('roleAdopter');
    const roleShelter = document.getElementById('roleShelter');
    const nameLabel = document.getElementById('nameLabel');
    const fullnameInput = document.getElementById('fullname');

    function updateRoleLabels() {
        if (roleShelter && roleShelter.checked) {
            nameLabel.innerHTML = 'Shelter / Organization Name <span class="text-danger">*</span>';
            fullnameInput.placeholder = 'Enter shelter or organization name';
        } else {
            nameLabel.innerHTML = 'Full Name <span class="text-danger">*</span>';
            fullnameInput.placeholder = 'Enter your full name';
        }
    }

    if (roleAdopter && roleShelter) {
        roleAdopter.addEventListener('change', updateRoleLabels);
        roleShelter.addEventListener('change', updateRoleLabels);
        updateRoleLabels();
    }
</script>
{% include 'footer.html' %}
</body>

</html>
