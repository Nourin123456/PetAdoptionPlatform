<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account | DreamlyPaws</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dreamly_theme.css') }}">
    <style>
        .register-container {
            max-width: 620px;
            margin: 40px auto;
        }
        .role-option-card {
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
        }
        .btn-check:checked + .role-option-card {
            border-color: #7c3aed;
            background-color: #f5f3ff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.15);
        }
    </style>
</head>

<body>
{% include 'navbar.html' %}

<div class="container py-5">
    <div class="register-container">

        <div class="dreamly-card p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="pill-tag mb-2">
                    <span>✨ Join Our Community</span>
                </div>
                <h2 class="dreamly-serif mb-1" style="font-size: 2.3rem;">
                    Create Your <span class="dreamly-gradient-text">Account</span>
                </h2>
                <p class="hand-note" style="color: #7c3aed; font-size: 1.25rem;">
                    Every great pet friendship starts here ♡
                </p>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show mb-4 rounded-4" role="alert">
                ⚠️ {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST" novalidate>

                <!-- REGISTER AS -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        I Want To Join As <span class="text-danger">*</span>
                    </label>
                    <div class="row g-3">
                        <div class="col-6">
                            <input type="radio"
                                   class="btn-check"
                                   name="role"
                                   id="roleAdopter"
                                   value="Adopter"
                                   {% if not form_data or form_data.get('role') == 'Adopter' %}checked{% endif %}
                                   required>
                            <label class="role-option-card d-block h-100" for="roleAdopter">
                                <div class="fw-bold fs-6" style="color: #7c3aed;">👤 Adopter</div>
                                <div class="text-muted small mt-1">Looking to adopt a loving pet</div>
                            </label>
                        </div>
                        <div class="col-6">
                            <input type="radio"
                                   class="btn-check"
                                   name="role"
                                   id="roleShelter"
                                   value="Shelter"
                                   {% if form_data and form_data.get('role') == 'Shelter' %}checked{% endif %}
                                   required>
                            <label class="role-option-card d-block h-100" for="roleShelter">
                                <div class="fw-bold fs-6" style="color: #7c3aed;">🏢 Shelter / Sanctuary</div>
                                <div class="text-muted small mt-1">Listing pets for adoption</div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- FULL NAME -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" id="nameLabel">
                        Full Name <span class="text-danger">*</span>
                    </label>
                    <input
                        type="text"
                        name="fullname"
                        id="fullname"
                        class="form-control"
                        placeholder="Enter your full name"
                        value="{{ form_data.fullname if form_data else '' }}"
                        pattern="^[A-Za-z\s.'-]+$"
                        required
                        minlength="2">
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Email Address <span class="text-danger">*</span>
                    </label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="example@gmail.com"
                        value="{{ form_data.email if form_data else '' }}"
                        required>
                </div>

                <!-- PHONE -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Phone Number <span class="text-danger">*</span>
                    </label>
                    <input
                        type="tel"
                        name="phone"
                        class="form-control"
                        placeholder="10-digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        minlength="10"
                        value="{{ form_data.phone if form_data else '' }}"
                        required>
                    <div class="form-text text-muted small">Must be exactly 10 digits without spaces or dashes.</div>
                </div>

                <!-- ADDRESS -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Address <span class="text-danger">*</span>
                    </label>
                    <textarea
                        name="address"
                        class="form-control"
                        rows="2"
                        placeholder="Enter your complete street address"
                        required>{{ form_data.address if form_data else '' }}</textarea>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Password <span class="text-danger">*</span>
                    </label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="At least 6 characters"
                        required
                        minlength="6">
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Confirm Password <span class="text-danger">*</span>
                    </label>
                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter your password"
                        required
                        minlength="6">
                </div>

                <button type="submit" class="btn btn-dark-pill btn-lg w-100 fw-bold py-3 mb-3">
                    Complete Registration →
                </button>

            </form>

            <p class="text-center text-muted mt-3 mb-0 small">
                Already registered?
                <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: #7c3aed;">
                    Sign in here
                </a>
            </p>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const roleAdopter = document.getElementById('roleAdopter');
    const roleShelter = document.getElementById('roleShelter');
    const nameLabel = document.getElementById('nameLabel');
    const fullnameInput = document.getElementById('fullname');

    function updateRoleLabels() {
        if (roleShelter && roleShelter.checked) {
            nameLabel.innerHTML = 'Shelter / Organization Name <span class="text-danger">*</span>';
            fullnameInput.placeholder = 'Enter shelter or organization name';
        } else {
            nameLabel.innerHTML = 'Full Name <span class="text-danger">*</span>';
            fullnameInput.placeholder = 'Enter your full name';
        }
    }

    if (roleAdopter && roleShelter) {
        roleAdopter.addEventListener('change', updateRoleLabels);
        roleShelter.addEventListener('change', updateRoleLabels);
        updateRoleLabels();
    }
</script>
{% include 'footer.html' %}
</body>

</html>
