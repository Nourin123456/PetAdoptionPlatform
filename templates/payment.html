<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .payment-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        .option {
            display: block;
            padding: 18px;
            margin: 15px 0;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            cursor: pointer;
        }

        .option:hover {
            border-color: #198754;
            background: #f4fbf7;
        }

        .option input {
            margin-right: 10px;
        }

        .option-title {
            font-weight: bold;
        }

        .option-description {
            display: block;
            margin-left: 25px;
            margin-top: 5px;
            color: #777;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover {
            background: #157347;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="payment-card">

        <h2>Choose Payment Method</h2>

        <p>
            Select how you would like to complete the payment.
        </p>

        <form method="POST">

            <label class="option">

                <input
                    type="radio"
                    name="payment_method"
                    value="Online"
                    required
                >

                <span class="option-title">
                    💳 Online Payment
                </span>

                <span class="option-description">
                    Complete the payment online.
                </span>

            </label>


            <label class="option">

                <input
                    type="radio"
                    name="payment_method"
                    value="COD"
                >

                <span class="option-title">
                    💵 Cash on Delivery
                </span>

                <span class="option-description">
                    Pay when the pet is delivered.
                </span>

            </label>


            <button
                type="submit"
                class="btn"
            >
                Continue to Transport
            </button>

        </form>

    </div>

</div>

</body>

</html>
