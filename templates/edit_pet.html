<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Pet</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

{% include 'navbar.html' %}

<div class="container mt-5 mb-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">✏️ Edit Pet</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Pet Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ pet[1] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Breed</label>
                <input type="text"
                       name="breed"
                       class="form-control"
                       value="{{ pet[2] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="text"
                       name="age"
                       class="form-control"
                       value="{{ pet[3] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select name="gender" class="form-select" required>

                    <option value="Male"
                        {% if pet[4] == "Male" %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if pet[4] == "Female" %}selected{% endif %}>
                        Female
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Vaccinated</label>

                <select name="vaccinated" class="form-select" required>

                    <option value="Yes"
                        {% if pet[5] == "Yes" %}selected{% endif %}>
                        Yes
                    </option>

                    <option value="No"
                        {% if pet[5] == "No" %}selected{% endif %}>
                        No
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea name="description"
                          class="form-control"
                          rows="4"
                          required>{{ pet[6] }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>

                <select name="status" class="form-select" required>

                    <option value="Available"
                        {% if pet[8] == "Available" %}selected{% endif %}>
                        Available
                    </option>

                    <option value="Adopted"
                        {% if pet[8] == "Adopted" %}selected{% endif %}>
                        Adopted
                    </option>

                </select>
            </div>

            <div class="text-center">

                <button type="submit" class="btn btn-primary">
                    💾 Update Pet
                </button>

                <a href="{{ url_for('admin') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% include 'footer.html' %}

</body>
</html>
