<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Pet</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

{% include 'navbar.html' %}


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        ✏️ Edit Pet
                    </h2>


                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >


                        <!-- CURRENT IMAGE -->

                        <div class="mb-4 text-center">

                            <label class="form-label fw-bold d-block">
                                Current Pet Image
                            </label>

                            <img
                                src="{{ url_for('static', filename='images/' + pet[7]) }}"
                                alt="{{ pet[1] }}"
                                class="rounded shadow-sm"
                                style="
                                    width: 220px;
                                    height: 220px;
                                    object-fit: cover;
                                "
                            >

                        </div>


                        <!-- CHANGE IMAGE -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Change Pet Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
                            >

                            <small class="text-muted">
                                Leave empty to keep the current image.
                            </small>

                        </div>


                        <!-- NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Pet Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ pet[1] }}"
                                required
                            >

                        </div>


                        <!-- BREED -->

                        <div class="mb-3">

                            <label class="form-label">
                                Breed
                            </label>

                            <input
                                type="text"
                                name="breed"
                                class="form-control"
                                value="{{ pet[2] }}"
                                required
                            >

                        </div>


                        <!-- AGE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Age
                            </label>

                            <input
                                type="text"
                                name="age"
                                class="form-control"
                                value="{{ pet[3] }}"
                                required
                            >

                        </div>


                        <!-- GENDER -->

                        <div class="mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <select
                                name="gender"
                                class="form-select"
                                required
                            >

                                <option
                                    value="Male"
                                    {% if pet[4] == "Male" %}selected{% endif %}
                                >
                                    Male
                                </option>

                                <option
                                    value="Female"
                                    {% if pet[4] == "Female" %}selected{% endif %}
                                >
                                    Female
                                </option>

                            </select>

                        </div>


                        <!-- VACCINATED -->

                        <div class="mb-3">

                            <label class="form-label">
                                Vaccinated
                            </label>

                            <select
                                name="vaccinated"
                                class="form-select"
                                required
                            >

                                <option
                                    value="Yes"
                                    {% if pet[5] == "Yes" %}selected{% endif %}
                                >
                                    Yes
                                </option>

                                <option
                                    value="No"
                                    {% if pet[5] == "No" %}selected{% endif %}
                                >
                                    No
                                </option>

                            </select>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                required
                            >{{ pet[6] }}</textarea>

                        </div>


                        <!-- STATUS -->

                        <div class="mb-4">

                            <label class="form-label">
                                Status
                            </label>

                            <select
                                name="status"
                                class="form-select"
                                required
                            >

                                <option
                                    value="Available"
                                    {% if pet[8] == "Available" %}selected{% endif %}
                                >
                                    Available
                                </option>

                                <option
                                    value="Adopted"
                                    {% if pet[8] == "Adopted" %}selected{% endif %}
                                >
                                    Adopted
                                </option>

                            </select>

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary px-4"
                            >
                                💾 Save Changes
                            </button>

                            <a
                                href="{{ url_for('admin') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


{% include 'footer.html' %}

</body>

</html>
