<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Pet | Shelter</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
        }

        .page-container {
            max-width: 850px;
            margin: 50px auto;
        }

        .pet-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        /* ==========================
           4:3 IMAGE PREVIEW
        ========================== */

        .image-preview {
            width: 100%;
            aspect-ratio: 4 / 3;

            border: 2px dashed #ced4da;

            border-radius: 14px;

            overflow: hidden;

            background: #f8f9fa;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 15px;
        }

        .image-preview img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .upload-box {
            cursor: pointer;
        }

        .btn-save {
            border-radius: 10px;
            padding: 12px 25px;
            font-weight: 600;
        }

        .btn-cancel {
            border-radius: 10px;
            padding: 12px 25px;
        }

    </style>

</head>


<body>

{% include 'navbar.html' %}


<div class="container page-container">

    <div class="pet-card">

        <h2 class="text-center page-title">

            ✏️ Edit Pet

        </h2>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <!-- ==========================
                 PET NAME
            =========================== -->

            <div class="mb-3">

                <label class="form-label">
                    Pet Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ pet[1] }}"
                    required
                >

            </div>


            <!-- ==========================
                 BREED
            =========================== -->

            <div class="mb-3">

                <label class="form-label">
                    Breed
                </label>

                <input
                    type="text"
                    name="breed"
                    class="form-control"
                    value="{{ pet[2] }}"
                    required
                >

            </div>


            <!-- ==========================
                 AGE
            =========================== -->

            <div class="mb-3">

                <label class="form-label">
                    Age
                </label>

                <input
                    type="text"
                    name="age"
                    class="form-control"
                    value="{{ pet[3] }}"
                    required
                >

            </div>


            <!-- ==========================
                 GENDER
            =========================== -->

            <div class="mb-3">

                <label class="form-label">
                    Gender
                </label>

                <select
                    name="gender"
                    class="form-select"
                    required
                >

                    <option
                        value="Male"
                        {% if pet[4] == "Male" %}
                        selected
                        {% endif %}
                    >
                        Male
                    </option>

                    <option
                        value="Female"
                        {% if pet[4] == "Female" %}
                        selected
                        {% endif %}
                    >
                        Female
                    </option>

                </select>

            </div>


            <!-- ==========================
                 VACCINATED
            =========================== -->

            <div class="mb-3">

                <label class="form-label">
                    Vaccinated
                </label>

                <select
                    name="vaccinated"
                    class="form-select"
                    required
                >

                    <option
                        value="Yes"
                        {% if pet[5] == "Yes" %}
                        selected
                        {% endif %}
                    >
                        Yes
                    </option>

                    <option
                        value="No"
                        {% if pet[5] == "No" %}
                        selected
                        {% endif %}
                    >
                        No
                    </option>

                </select>

            </div>


            <!-- ==========================
                 DESCRIPTION
            =========================== -->

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    required
                >{{ pet[6] }}</textarea>

            </div>


            <!-- ==========================
                 STATUS
            =========================== -->

            <div class="mb-3">

                <label class="form-label">
                    Pet Status
                </label>

                <select
                    name="status"
                    class="form-select"
                    required
                >

                    <option
                        value="Available"
                        {% if pet[8] == "Available" %}
                        selected
                        {% endif %}
                    >
                        Available
                    </option>

                    <option
                        value="Adopted"
                        {% if pet[8] == "Adopted" %}
                        selected
                        {% endif %}
                    >
                        Adopted
                    </option>

                </select>

            </div>


            <!-- ==========================
                 CURRENT / NEW IMAGE
            =========================== -->

            <div class="mb-4">

                <label class="form-label">
                    Pet Image
                </label>


                <div
                    class="image-preview upload-box"
                    onclick="document.getElementById('image').click()"
                >

                    <img
                        id="previewImage"
                        src="{{ url_for('static', filename='images/' + pet[7]) }}"
                        alt="{{ pet[1] }}"
                    >

                </div>


                <input
                    type="file"
                    id="image"
                    name="image"
                    class="form-control"
                    accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
                >

                <small class="text-muted">

                    Select a new image to replace the current image.
                    Recommended ratio: 4:3.

                </small>

            </div>


            <!-- ==========================
                 BUTTONS
            =========================== -->

            <div class="d-flex gap-2 justify-content-center">

                <a
                    href="{{ url_for('shelter_pets') }}"
                    class="btn btn-secondary btn-cancel"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn btn-success btn-save"
                >
                    💾 Save Changes
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const imageInput =
    document.getElementById("image");

const previewImage =
    document.getElementById("previewImage");


imageInput.addEventListener(
    "change",
    function () {

        const file = this.files[0];

        if (file) {

            const reader =
                new FileReader();

            reader.onload =
                function (e) {

                    previewImage.src =
                        e.target.result;

                };

            reader.readAsDataURL(file);
        }

    }
);

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


{% include 'footer.html' %}

</body>

</html>
