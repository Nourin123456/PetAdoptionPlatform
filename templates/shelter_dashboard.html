<!DOCTYPE html>
<html>

<head>

    <title>Shelter Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

{% include 'navbar.html' %}

<div class="container mt-5">

    <h2 class="mb-4">
        🏠 Shelter Dashboard
    </h2>

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h4>🐾 My Pets</h4>

                    <p>
                        Manage the pets registered by your shelter.
                    </p>

                    <button class="btn btn-success" disabled>
                        My Pets
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h4>📋 Adoption Requests</h4>

                    <p>
                        View and manage adoption requests.
                    </p>

                    <button class="btn btn-primary" disabled>
                        Requests
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h4>➕ Add Pet</h4>

                    <p>
                        Add a new pet to your shelter.
                    </p>

                    <button class="btn btn-warning" disabled>
                        Add Pet
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

{% include 'footer.html' %}

</body>

</html>
