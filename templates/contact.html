<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Pet Adoption</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .contact-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .contact-card {
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        .contact-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .contact-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 9px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #198754;

            box-shadow:
                0 0 0 0.2rem rgba(25,135,84,0.12);
        }

        .send-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #198754;
            color: white;

            font-weight: 600;
            font-size: 16px;
        }

        .send-btn:hover {
            background: #157347;
        }

    </style>

</head>


<body>

{% include 'navbar.html' %}


<div class="contact-container">

    <div class="contact-card">

        <h2 class="contact-title">
            📩 Contact Us
        </h2>

        <p class="contact-subtitle">
            Have a question? Send us a message.
        </p>


        {% if success %}

        <div class="alert alert-success">

            ✓ {{ success }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('contact') }}"
        >


            <!-- NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Your Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >

            </div>


            <!-- SUBJECT -->

            <div class="mb-3">

                <label class="form-label">
                    Subject
                </label>

                <input
                    type="text"
                    name="subject"
                    class="form-control"
                    placeholder="What is your message about?"
                    required
                >

            </div>


            <!-- MESSAGE -->

            <div class="mb-4">

                <label class="form-label">
                    Message
                </label>

                <textarea
                    name="message"
                    class="form-control"
                    rows="6"
                    placeholder="Write your message here..."
                    required
                ></textarea>

            </div>


            <!-- SEND -->

            <button
                type="submit"
                class="send-btn"
            >
                📩 Send Message
            </button>


        </form>

    </div>

</div>


{% include 'footer.html' %}


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
