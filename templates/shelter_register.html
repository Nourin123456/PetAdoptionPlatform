<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Registration | DreamlyPaws</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dreamly_theme.css') }}">
    <style>
        .register-container {
            max-width: 620px;
            margin: 40px auto;
        }
    </style>
</head>

<body>

{% include 'navbar.html' %}

<div class="container py-5">
    <div class="register-container">

        <div class="dreamly-card p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="pill-tag mb-2">
                    <span>🏠 Sanctuary Partnership</span>
                </div>
                <h2 class="dreamly-serif mb-1" style="font-size: 2.3rem;">
                    Shelter <span class="dreamly-gradient-text">Registration</span>
                </h2>
                <p class="hand-note" style="color: #7c3aed; font-size: 1.25rem;">
                    Partner with us to find forever loving families ♡
                </p>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show mb-4 rounded-4" role="alert">
                ⚠️ {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Shelter / Sanctuary Name <span class="text-danger">*</span></label>
                    <input
                        type="text"
                        name="fullname"
                        class="form-control"
                        placeholder="Enter shelter or organization name"
                        pattern="^[A-Za-z0-9\s.'-]+$"
                        minlength="2"
                        maxlength="100"
                        value="{{ form_data.fullname if form_data else '' }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="shelter@example.com"
                        value="{{ form_data.email if form_data else '' }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                    <input
                        type="tel"
                        name="phone"
                        class="form-control"
                        placeholder="10-digit phone number"
                        pattern="[0-9]{10}"
                        minlength="10"
                        maxlength="10"
                        value="{{ form_data.phone if form_data else '' }}"
                        required>
                    <div class="form-text text-muted small">Must be a valid 10-digit phone number.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Physical Shelter Address <span class="text-danger">*</span></label>
                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"
                        placeholder="Enter physical address where pets are housed"
                        minlength="5"
                        maxlength="300"
                        required>{{ form_data.address if form_data else '' }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Create Password <span class="text-danger">*</span></label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-dark-pill btn-lg w-100 fw-bold py-3">
                    Submit Shelter Application →
                </button>

            </form>

        </div>

    </div>
</div>

{% include 'footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
