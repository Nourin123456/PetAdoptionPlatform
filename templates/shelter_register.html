<!DOCTYPE html>
<html>

<head>

    <title>Shelter Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

{% include 'navbar.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        🏠 Shelter / Breeder Registration
                    </h2>

                    <form method="POST">

                        <div class="mb-3">
                            <label>Full Name</label>
                            <input
                                type="text"
                                name="fullname"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>Phone</label>
                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>Address</label>
                            <textarea
                                name="address"
                                class="form-control"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Register as Shelter

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% include 'footer.html' %}

</body>
</html>
