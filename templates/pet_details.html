<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ pet[1] }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
{% include 'navbar.html' %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <img src="{{ url_for('static', filename='images/' + pet[7]) }}"
             class="img-fluid rounded mb-4"
             style="max-height:400px; object-fit:cover;">

        <h2>{{ pet[1] }}</h2>

        <hr>

        <p><strong>Breed:</strong> {{ pet[2] }}</p>

        <p><strong>Age:</strong> {{ pet[3] }}</p>

        <p><strong>Gender:</strong> {{ pet[4] }}</p>

        <p><strong>Vaccinated:</strong> {{ pet[5] }}</p>

        <p><strong>Description:</strong></p>

        <p>{{ pet[6] }}</p>

        <a href="/adoption/{{ pet[0] }}" class="btn btn-primary">
            Adopt Now ❤️
        </a>

        <a href="/pets" class="btn btn-secondary mt-2">
            ← Back to Pets
        </a>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% include 'footer.html' %}
</body>
</html>
