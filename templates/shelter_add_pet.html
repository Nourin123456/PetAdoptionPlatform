<!DOCTYPE html>
<html>

<head>

    <title>Add Pet</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

{% include 'navbar.html' %}

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 650px;">

        <div class="card-body">

            <h2 class="mb-4">🐾 Add New Pet</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Pet Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Breed</label>
                    <input type="text"
                           name="breed"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="text"
                           name="age"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <select name="gender" class="form-select">

                        <option value="Male">Male</option>
                        <option value="Female">Female</option>

                    </select>

                </div>

                <div class="mb-3">
                    <label class="form-label">Vaccinated</label>

                    <select name="vaccinated" class="form-select">

                        <option value="Yes">Yes</option>
                        <option value="No">No</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Description</label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        required></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100">

                    Add Pet

                </button>

            </form>

        </div>

    </div>

</div>

{% include 'footer.html' %}

</body>

</html>
