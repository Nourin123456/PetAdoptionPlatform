<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Available Pets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
{% include 'navbar.html' %}

<div class="container mt-5">

    <form method="GET" action="{{ url_for('pets') }}" class="mb-4"> 

    <div class="input-group">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search by pet name or breed">

        <button class="btn btn-success">
            🔍 Search
        </button>

    </div>
<div class="text-center mb-4">

    <a href="{{ url_for('pets') }}" class="btn btn-dark m-1">
        🐾 All
    </a>

    <a href="{{ url_for('pets', category='Labrador') }}" class="btn btn-primary m-1">
        🐶 Dogs
    </a>

    <a href="{{ url_for('pets', category='Persian') }}" class="btn btn-warning m-1">
        🐱 Cats
    </a>

    <a href="{{ url_for('pets', category='Rabbit') }}" class="btn btn-success m-1">
        🐰 Rabbits
    </a>

</div>
</form> 

    <h2 class="text-center mb-4">Available Pets</h2>

    <div class="row">

        {% for pet in pets %}

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <img src="{{ url_for('static', filename='images/' + pet[7]) }}"
                     class="card-img-top">

                <div class="card-body">

                    <h4>{{ pet[1] }}</h4>

                    <p><strong>Breed:</strong> {{ pet[2] }}</p>

                    <p><strong>Age:</strong> {{ pet[3] }}</p>

                    <a href="/pet_details/{{ pet[0] }}"
                       class="btn btn-success w-100">

                        View Details

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% include 'footer.html' %}
</body>

</html>
